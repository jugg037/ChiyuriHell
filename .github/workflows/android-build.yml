name: Android APK Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION_NAME" ] || [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::Release tag v$TAG_VERSION does not match app versionName $VERSION_NAME"
            exit 1
          fi

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare checksum
        shell: bash
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChiyuriDesktop-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "ChiyuriDesktop-${GITHUB_REF_NAME}.apk"
          sha256sum "ChiyuriDesktop-${GITHUB_REF_NAME}.apk" > "ChiyuriDesktop-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Chiyuri Desktop ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
          files: |
            ChiyuriDesktop-${{ github.ref_name }}.apk
            ChiyuriDesktop-${{ github.ref_name }}.apk.sha256
