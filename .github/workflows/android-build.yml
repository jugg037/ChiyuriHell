name: Android APK Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate release readiness and tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ ! -f RELEASE_READY ] || ! grep -qx "READY" RELEASE_READY; then
            echo "::error::Release blocked: final audit has not approved RELEASE_READY"
            exit 1
          fi
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::Release blocked: curated RELEASE_NOTES.md is missing"
            exit 1
          fi
          for checklist in README.md FINAL_AUDIT.md; do
            if grep -qE '^- \[ \]' "$checklist"; then
              echo "::error::Release blocked: unchecked items remain in $checklist"
              grep -nE '^- \[ \]' "$checklist"
              exit 1
            fi
          done
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          APPLICATION_ID="$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION_NAME" ] || [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::Release tag v$TAG_VERSION does not match app versionName $VERSION_NAME"
            exit 1
          fi
          if [ "$APPLICATION_ID" != "com.chiyuri.desktop" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Unexpected applicationId or missing versionCode"
            exit 1
          fi
          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-version:refname | grep -vx "$GITHUB_REF_NAME" | head -n 1 || true)"
          if [ -n "$PREVIOUS_TAG" ]; then
            PREVIOUS_CODE="$(git show "$PREVIOUS_TAG:app/build.gradle.kts" | sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' | head -n 1)"
            if [ -z "$PREVIOUS_CODE" ] || [ "$VERSION_CODE" -le "$PREVIOUS_CODE" ]; then
              echo "::error::versionCode $VERSION_CODE must be greater than previous release $PREVIOUS_TAG ($PREVIOUS_CODE)"
              exit 1
            fi
          fi

      - name: Run Android lint and unit tests
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChiyuriDesktop-verification-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify debug APK package metadata
        shell: bash
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [ -z "$AAPT" ]; then
            echo "::error::Android aapt tool not found"
            exit 1
          fi
          BADGING="$("$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk)"
          echo "$BADGING" | grep -F "package: name='com.chiyuri.desktop'" >/dev/null
          EXPECTED_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          EXPECTED_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          echo "$BADGING" | grep -F "versionCode='$EXPECTED_CODE' versionName='$EXPECTED_NAME'" >/dev/null

      - name: Prepare checksum
        shell: bash
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          sha256sum --check app-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChiyuriDesktop-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      # Installable release-variant build for tablet validation. It is signed
      # with the temporary debug certificate and is never published as a release.
      - name: Build signed release-variant test APK
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_TEST_WITH_DEBUG_KEY: "true"
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release-variant test APK
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.chiyuri.desktop'" >/dev/null
          EXPECTED_NAME="$(sed -n 's/.*versionName = "\\([^"]*\\)".*/\\1/p' app/build.gradle.kts | head -n 1)"
          EXPECTED_CODE="$(sed -n 's/.*versionCode = \\([0-9][0-9]*\\).*/\\1/p' app/build.gradle.kts | head -n 1)"
          echo "$BADGING" | grep -F "versionCode='$EXPECTED_CODE' versionName='$EXPECTED_NAME'" >/dev/null
          mkdir -p release-test
          cp "$APK" "release-test/ChiyuriDesktop-release-test-${GITHUB_RUN_NUMBER}.apk"
          cd release-test
          sha256sum *.apk > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload release-variant test APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ChiyuriDesktop-release-test
          path: |
            release-test/*.apk
            release-test/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chiyuri-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/chiyuri-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are incomplete"
            exit 1
          fi
          gradle --no-daemon :app:assembleRelease

      - name: Verify release APK signature
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner tool not found"
            exit 1
          fi
          APK="app/build/outputs/apk/release/app-release.apk"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [ -z "$AAPT" ]; then
            echo "::error::Android aapt tool not found"
            exit 1
          fi
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.chiyuri.desktop'" >/dev/null
          EXPECTED_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          EXPECTED_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          echo "$BADGING" | grep -F "versionCode='$EXPECTED_CODE' versionName='$EXPECTED_NAME'" >/dev/null

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk "ChiyuriDesktop-${GITHUB_REF_NAME}.apk"
          sha256sum "ChiyuriDesktop-${GITHUB_REF_NAME}.apk" > "ChiyuriDesktop-${GITHUB_REF_NAME}.apk.sha256"
          sha256sum --check "ChiyuriDesktop-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Chiyuri Desktop ${{ github.ref_name }}
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          prerelease: false
          files: |
            ChiyuriDesktop-${{ github.ref_name }}.apk
            ChiyuriDesktop-${{ github.ref_name }}.apk.sha256
