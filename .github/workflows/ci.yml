name: Chiyuri AI CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chiyuri-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest

  portable-build:
    name: Portable Windows x64 build
    needs: quality
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build portable application
        run: pyinstaller --noconfirm --clean --windowed --onedir --name ChiyuriAI src/chiyuri_ai/__main__.py
      - name: Create archive
        run: Compress-Archive -Path dist/ChiyuriAI/* -DestinationPath ChiyuriAI-Windows-x64.zip
        shell: pwsh
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: ChiyuriAI-Windows-x64
          path: ChiyuriAI-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
