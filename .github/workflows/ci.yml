name: Chiyuri AI CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chiyuri-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest

  portable-build:
    name: Portable Windows x64 build and installer
    needs: quality
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build portable application
        run: pyinstaller --noconfirm --clean --windowed --onedir --name ChiyuriAI src/chiyuri_ai/__main__.py
      - name: Create portable archive
        run: Compress-Archive -Path dist/ChiyuriAI/* -DestinationPath ChiyuriAI-Windows-x64.zip
        shell: pwsh
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile Windows installer
        shell: pwsh
        run: |
          $version = (Select-String -Path src/chiyuri_ai/__init__.py -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          if (-not $version) { throw "Could not read application version" }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not found: $compiler" }
          & $compiler "/DAppVersion=$version" "packaging\ChiyuriAI.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\ChiyuriAI-Setup.exe")) { throw "Installer EXE was not created" }
          if ((Get-Item "dist\ChiyuriAI-Setup.exe").Length -lt 1MB) { throw "Installer EXE is unexpectedly small" }
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: ChiyuriAI-Windows-x64
          path: ChiyuriAI-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ChiyuriAI-Windows-Installer
          path: dist/ChiyuriAI-Setup.exe
          if-no-files-found: error
          retention-days: 14
